<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Opiskelijaravintolat ja ruokalistat Suomessa">
    <title>Student Restaurants</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Student Restaurants</h1>
            <p>Opiskelijaravintolat ja ruokalistat Suomessa</p>
        </div>
    </header>

    <main class="container">
        <section class="restaurants-section">
            <h2>Ravintolat</h2>

        
        <div class="search-container">
            <label for="restaurant-search">Hae ravintolaa</label>
            <input
                type="search"
                id="restaurant-search"
                placeholder="Kirjoita ravintolan nimi..."
                autocomplete="off"
            >

            <label for="city-filter">Suodata kaupungin mukaan</label>
            <select id="city-filter">
                <option value="">Kaikki kaupungit</option>
            </select>
        </div>
        


            <p id="restaurant-count" class="result-count" aria-live="polite"></p>

            <div id="restaurant-list" class="restaurant-list">
                <p>Ladataan ravintoloita...</p>
            </div>
        </section>

        <section id="menu-section" class="menu-section hidden">
            <h2 id="restaurant-name">Valitse ravintola</h2>

            <div class="menu-buttons">
                <button id="daily-menu-button" type="button">
                    Päivän menu
                </button>
                <button id="weekly-menu-button" type="button">
                    Viikon menu
                </button>
            </div>

            <div id="menu-container" aria-live="polite">
                <p>Valitse ruokalista.</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Student Restaurants Finland</p>
        </div>
    </footer>
</body>
</html>
