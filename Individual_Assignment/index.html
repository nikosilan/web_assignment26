<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Restaurants Finland</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Student Restaurants</h1>
            <p>Opiskelijaravintolat ja ruokalistat Suomessa</p>
        </div>
    </header>

    <main class="container">

        <section class="restaurants-section">
            <h2>Ravintolat</h2>

            <div id="restaurant-list" class="restaurant-list">
                <p>Ladataan ravintoloita...</p>
            </div>
        </section>

        <section id="menu-section" class="menu-section hidden">

            <h2 id="restaurant-name"></h2>

            <div class="menu-buttons">
                <button id="daily-menu-button">
                    Päivän menu
                </button>

                <button id="weekly-menu-button">
                    Viikon menu
                </button>
            </div>

            <div id="menu-container">
                <p>Valitse ruokalista.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Student Restaurants</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
